const diagrams = ["flowchart TD\n    subgraph ExternalActors[\"الفاعلون من الأفراد والمؤسسات\"]\n        Patient[\"المريض / العميل<br/>(Patient / Customer)\"]\n        Pharmacist[\"الصيدلي السريري / موظف المبيعات<br/>(Clinical Pharmacist / Staff)\"]\n        ProcManager[\"مدير المشتريات والمخزن<br/>(Procurement Manager)\"]\n        Accountant[\"المحاسب المالي<br/>(Financial Accountant)\"]\n        AdminUser[\"المدير التنفيذي والمشرف<br/>(Super Admin / Pharmacy Owner)\"]\n        Auditor[\"مفتش الحوكمة والرقابة<br/>(Forensic Auditor)\"]\n        Supplier[\"المورد التجاري المعتمد<br/>(Authorized Supplier)\"]\n    end\n\n    subgraph AICOSBoundary[\"حدود منظومة AI-COS — نظام التشغيل التجاري الوكلائي\"]\n        CoreKernel[\"نواة النظام ونظام تشغيل الأعمال<br/>(AI-COS Core Business Kernel)\"]\n        AgenticSuite[\"مجلس الوكلاء الأذكياء واستخبارات السوق<br/>(9 Agents + Market Intelligence)\"]\n        EnterprisePortals[\"البوابات الإدارية والمتجر الإلكتروني<br/>(21 Admin Interfaces & Storefront)\"]\n    end\n\n    subgraph ExternalPlatforms[\"الخدمات والمنصات الخارجية المتكاملة\"]\n        SupabaseDB[(\"قاعدة البيانات السحابية<br/>PostgreSQL 15 / Supabase\")]\n        LocalOllama[\"خادم النماذج المحلية<br/>Ollama Qwen 2.5:7B\"]\n        CloudGemini[\"النماذج السحابية المتقدمة<br/>Gemini 3.8 Flash / Gemma 4:31B\"]\n        N8nEngine[\"محرك أتمتة مهام العمل<br/>n8n Workflow Engine\"]\n        TelegramBot[\"شبكة تنبيهات الطوارئ<br/>Telegram Bot API\"]\n        EDAFeed[\"المنشورات الرقابية لهيئة الدواء<br/>EDA Circulars / Market Scrapers\"]\n        WORMLogFile[(\"سجل التدقيق الخارجي المشفر<br/>External WORM Ledger (Physical Disk)\")]\n    end\n\n    %% Data Inflows and Outflows\n    Patient <-->|تصفح الكتالوج، رفع الروشتات، طلبات المبيعات| EnterprisePortals\n    Pharmacist <-->|مراجعة الروشتات، صرف الأدوية، فحص التعارضات| EnterprisePortals\n    ProcManager <-->|مراجعة نقط إعادة الطلب، اعتماد أوامر الشراء| EnterprisePortals\n    Accountant <-->|مراجعة قيود اليومية وميزان المراجعة| EnterprisePortals\n    AdminUser <-->|مراقبة بطاقة الأداء، تبديل الحزم الرأسية، اعتماد القرارات| EnterprisePortals\n    Auditor <-->|فحص سجلات WORM ومؤشرات الاحتيال المالي| EnterprisePortals\n    ProcManager -->|إصدار أوامر التوريد الرسمية| Supplier\n    Supplier -->|توريد الشحنات وفواتير الشراء| ProcManager\n\n    EnterprisePortals <--> CoreKernel\n    CoreKernel <--> AgenticSuite\n\n    CoreKernel <-->|قراءة وكتابة المعاملات، عزل RLS| SupabaseDB\n    AgenticSuite <-->|استدلال لغوي محلي بدون اتصال| LocalOllama\n    AgenticSuite <-->|تحليل استخبارات السوق والقرارات المتقدمة| CloudGemini\n    CoreKernel -->|إطلاق المهام وإشعارات القنوات| N8nEngine\n    N8nEngine -->|استدعاء راجع لتوثيق التسليم| CoreKernel\n    N8nEngine -->|إرسال التنبيهات الفورية| TelegramBot\n    EDAFeed -->|\"رصد سحب الأدوية ونقص الأصناف\"| AgenticSuite\n    CoreKernel -->|كتابة متزامنة مشفرة بسلسلة SHA-256| WORMLogFile", "flowchart LR\n    CustomerEntity[\"العميل / المريض<br/>(Customer / Patient)\"]\n    StaffEntity[\"الصيدلي وموظف المبيعات<br/>(Pharmacist / Staff)\"]\n    SupplierEntity[\"المورد الخارجي<br/>(Supplier)\"]\n    AdminEntity[\"الإدارة التنفيذية<br/>(Executive Management)\"]\n    AuditorEntity[\"الجهات الرقابية والمفتش<br/>(Audit Authority)\"]\n    N8nEntity[\"محرك الأتمتة الخارجي<br/>(n8n Automation)\"]\n    AIModelEntity[\"محركات الذكاء الاصطناعي<br/>(LLMs: Ollama / Gemini)\"]\n\n    AICOSSystem((\"0.0<br/>منظومة AI-COS<br/>Agentic Business OS\"))\n\n    %% Customer flows\n    CustomerEntity -->|بيانات التسجيل، طلبات الشراء، صور الروشتات| AICOSSystem\n    AICOSSystem -->|تأكيد الطلبات، الفواتير، تنبيهات الجرعات، التوجيه الطبي| CustomerEntity\n\n    %% Staff flows\n    StaffEntity -->|اعتماد صرف الروشتات، إدخال المبيعات، تصحيحات OCR| AICOSSystem\n    AICOSSystem -->|تنبيهات التداخلات الدوائية، تفاصيل الروشتات المفسرة| StaffEntity\n\n    %% Supplier flows\n    AICOSSystem -->|أوامر الشراء المعتمدة Purchase Orders| SupplierEntity\n    SupplierEntity -->|إشعارات الشحن، فواتير التوريد، أرقام التشغيلات| AICOSSystem\n\n    %% Admin flows\n    AdminEntity -->|سياسات التسعير، مصادقة قرارات الوكلاء، اختيار الحزم| AICOSSystem\n    AICOSSystem -->|مؤشرات الأداء، تقارير CCC، توصيات الوكلاء التنفيذية| AdminEntity\n\n    %% Auditor flows\n    AuditorEntity -->|طلبات فحص السجلات ومطابقة العمليات| AICOSSystem\n    AICOSSystem -->|صكوك التفتيش الرقمية، تقارير فحص بنفورد، سجل الهاش| AuditorEntity\n\n    %% n8n flows\n    AICOSSystem -->|إشارات Webhooks للمهام التذكيرية والتنبيهية| N8nEntity\n    N8nEntity -->|إشارات الاستدعاء الراجع Callback لتوثيق التسليم| AICOSSystem\n\n    %% AI Model flows\n    AICOSSystem -->|السياق المنقح، البيانات المحسوبة، برومبت الاستدلال| AIModelEntity\n    AIModelEntity -->|الصياغة اللغوية، التوصيات النصية المفسرة| AICOSSystem", "flowchart TD\n    %% External Entities\n    UserExt[\"المستخدمون (عملاء / إدارة)\"]\n    SuppExt[\"الموردون\"]\n    N8nExt[\"محرك n8n\"]\n    AIExt[\"نماذج LLM\"]\n    DiskExt[\"القرص الفيزيائي\"]\n\n    %% Data Stores\n    D1[(\"D1: جدول المستخدمين والتوثيق (Customers / Sessions)\")]\n    D2[(\"D2: كتالوج الأدوية والمعرفة (Drugs / Interactions / Knowledge)\")]\n    D3[(\"D3: سجل الطلبات والروشتات (Orders / Prescriptions / Items)\")]\n    D4[(\"D4: المخزون وحركات الأصناف (Inventory / Batches / POs)\")]\n    D5[(\"D5: الأستاذ العام والقيود (Journal Entries / Accounts)\")]\n    D6[(\"D6: سجل التدقيق والكوبونات (Audit Logs / Coupons)\")]\n    D7[(\"D7: سجل الأتمتة والمحاولات (Automation Runs / Metrics)\")]\n    D8[(\"D8: توصيفات الحزم الرأسية (Vertical Configs YAML)\")]\n\n    %% Processes\n    P1((\"1.0<br/>إدارة الهوية والوصول<br/>(IAM & Auth)\"))\n    P2((\"2.0<br/>إدارة الكتالوج والمعرفة<br/>(Catalog & Knowledge)\"))\n    P3((\"3.0<br/>الطلبات والتحقق السريري<br/>(Order & CDSS)\"))\n    P4((\"4.0<br/>المشتريات والتوريد<br/>(Procurement & P2P)\"))\n    P5((\"5.0<br/>المحاسبة والأستاذ العام<br/>(General Ledger AIS)\"))\n    P6((\"6.0<br/>إدارة ودعم قرار الوكلاء<br/>(Agentic AI Suite)\"))\n    P7((\"7.0<br/>استخبارات السوق والقرارات<br/>(Market Intelligence)\"))\n    P8((\"8.0<br/>الأتمتة وضمان التسليم<br/>(Automation Loop)\"))\n    P9((\"9.0<br/>الحوكمة وسجل WORM<br/>(Governance & WORM)\"))\n    P10((\"10.0<br/>التوصيف الرأسي<br/>(Verticalization)\"))\n\n    %% Interactions Process 1\n    UserExt -->|بيانات الدخول| P1\n    P1 <-->|التحقق وتخزين الجلسات| D1\n    P1 -->|رمز JWT ومعرّف المستأجر| P3\n    P1 -->|سياق المستخدم المصرح| P6\n\n    %% Interactions Process 2\n    UserExt -->|تصفح وبحث| P2\n    P2 <-->|استرجاع الأصناف والتعارضات| D2\n\n    %% Interactions Process 3\n    UserExt -->|إنشاء طلب / رفع روشتة| P3\n    P3 <-->|فحص التعارضات والبدائل| D2\n    P3 -->|تأكيد الطلب وحفظ الروشتة| D3\n    P3 -->|حجز المخزون التشاؤمي| D4\n    P3 -->|إشعار حدث مبيعات مؤكد| P5\n    P3 -->|طلب توثيق تدقيق| P9\n\n    %% Interactions Process 4\n    P4 <-->|فحص الأرصدة ونقطة ROP| D4\n    P4 -->|أمر شراء رسمي| SuppExt\n    SuppExt -->|فاتورة استلام الشحنة| P4\n    P4 -->|توليد قيد مشتريات| P5\n    P4 -->|طلب توثيق توريد| P9\n\n    %% Interactions Process 5\n    P5 -->|إدراج قيود اليومية الموزونة| D5\n    P5 -->|تحديث ميزان المراجعة| D5\n    P5 -->|مؤشرات مالية للوكيل المالي| P6\n\n    %% Interactions Process 6\n    P6 <-->|سحب الأرقام الحتمية| D3\n    P6 <-->|سحب أرصدة المخزون| D4\n    P6 <-->|استرجاع المؤشرات المحاسبية| D5\n    P6 <-->|صياغة وتفسير التوصيات| AIExt\n    P6 -->|اقتراح أوامر شراء ذكية| P4\n    P6 -->|توليد كوبونات تسويقية مقيدة| D6\n    P6 -->|إطلاق مهام تذكير العملاء| P8\n\n    %% Interactions Process 7\n    UserExt -->|\"رصد منشورات سحب الأدوية\"| P7\n    P7 <-->|استرجاع الأصناف المتأثرة| D2\n    P7 -->|مقترح حجر أو توريد طارئ| P4\n    P7 -->|توثيق قرار تنفيذي| P9\n\n    %% Interactions Process 8\n    P8 -->|إرسال مهام Webhook| N8nExt\n    N8nExt -->|إشعار إنجاز Callback| P8\n    P8 <-->|تسجيل حالات التشغيل وإعادة المحاولة| D7\n\n    %% Interactions Process 9\n    P9 <-->|حساب سلسلة الهاشات| D6\n    P9 -->|كتابة متزامنة قسرية fsync| DiskExt\n\n    %% Interactions Process 10\n    UserExt -->|طلب تبديل القطاع| P10\n    P10 <-->|قراءة ملفات YAML والتوصيفات| D8\n    P10 -->|حقن المصطلحات والسقوف| P6\n    P10 -->|تحديث شاشات الواجهة| UserExt", "flowchart TD\n    %% Inputs\n    InvStore[(\"D4: المخزون وحركات الأصناف\")]\n    SuppStore[(\"جدول الموردين المعتمدين\")]\n    GLStore[(\"D5: الأستاذ العام\")]\n    WORMStore[(\"D6: سجل التدقيق و WORM\")]\n    ManagerActor[\"مدير الصيدلية / المشتريات\"]\n    SuppActor[\"المورد التجاري\"]\n\n    %% Sub-processes\n    P4_1((\"4.1<br/>فحص الرصيد اللحظي<br/>ومعدل النضوب\"))\n    P4_2((\"4.2<br/>حساب كمية الطلب<br/>الاقتصادي Wilson EOQ\"))\n    P4_3((\"4.3<br/>إنشاء مسودة أمر الشراء<br/>(DRAFT PO)\"))\n    P4_4((\"4.4<br/>اعتماد الإدارة<br/>(Maker-Checker)\"))\n    P4_5((\"4.5<br/>إصدار وإرسال الأمر<br/>(SENT PO)\"))\n    P4_6((\"4.6<br/>استلام الشحنة والفحص<br/>(Receiving & Inspection)\"))\n    P4_7((\"4.7<br/>تحديث أرصدة المخزون<br/>وتكلفة الصنف\"))\n    P4_8((\"4.8<br/>توليد قيد اليومية الآلي<br/>(Auto Procurement JV)\"))\n    P4_9((\"4.9<br/>بصمة التوثيق في WORM<br/>(Ledger Anchoring)\"))\n\n    %% Data Flows\n    InvStore -->|الرصيد الحالي والمبيعات| P4_1\n    P4_1 -->|بيان الأصناف الواصلة لنقطة ROP| P4_2\n    P4_2 -->|الكمية المثلى EOQ| P4_3\n    SuppStore -->|بيانات الموردين وشروط الائتمان| P4_3\n    P4_3 -->|مسودة أمر الشراء| ManagerActor\n    ManagerActor -->|قرار الاعتماد والتوقيع| P4_4\n    P4_4 -->|أمر معتمد APPROVED| P4_5\n    P4_5 -->|إرسال أمر التوريد| SuppActor\n    SuppActor -->|وصول البضاعة والفاتورة| P4_6\n    P4_6 -->|إشعار المطابقة والاستلام| P4_7\n    P4_7 -->|إضافة الكميات الفعلية| InvStore\n    P4_6 -->|بيانات التكلفة الإجمالية| P4_8\n    P4_8 -->|إدراج قيد: من حـ/ المخزون إلى حـ/ الموردين| GLStore\n    P4_6 -->|تفاصيل حركة الاستلام ورقم الفاتورة| P4_9\n    P4_9 -->|توقيع الهاش في السجل المشفر| WORMStore", "flowchart TD\n    %% Inputs\n    AdminActor[\"المسؤول الإداري\"]\n    OrderStore[(\"D3: المبيعات والطلبات\")]\n    PackStore[(\"D8: الحزم الرأسية\")]\n    AuditStore[(\"D6: سجل التدقيق\")]\n    LLMExt[\"نماذج الذكاء الاصطناعي LLM\"]\n\n    %% Sub-processes\n    P6_1((\"6.1<br/>استقبال الاستفسار والفرز الكشفي<br/>(Fast-Path Router)\"))\n    P6_2((\"6.2<br/>تجميع البيانات الحتمية<br/>(Data Aggregation)\"))\n    P6_3((\"6.3<br/>حساب العائد والهامش الرياضي<br/>(ROI & Margin Engine)\"))\n    P6_4((\"6.4<br/>تطبيق سقوف الحوكمة<br/>(Margin Cap Clamp)\"))\n    P6_5((\"6.5<br/>الصياغة اللغوية والتبرير<br/>(LLM Articulation)\"))\n    P6_6((\"6.6<br/>بوابة الاعتماد البشري<br/>(Human-in-the-Loop)\"))\n    P6_7((\"6.7<br/>تنفيذ الإجراء وتوثيقه<br/>(Execution & Logging)\"))\n\n    %% Data Flows\n    AdminActor -->|استفسار تسعيري أو حملة تسويقية| P6_1\n    P6_1 -->|توجيه فوري للوكيل المختص| P6_2\n    OrderStore -->|المبيعات وتكلفة الصنف COGS| P6_2\n    P6_2 -->|الأرقام المالية المجمعة| P6_3\n    P6_3 -->|نسب الخصم والعائد المحسوبة| P6_4\n    PackStore -->|سقف الهامش المسموح به 10% أو 15%| P6_4\n    P6_4 -->|الأرقام المحصنة والمقيدة| P6_5\n    LLMExt <-->|توليد الصياغة التفسيرية بدون تلاعب رقمي| P6_5\n    P6_5 -->|بطاقة التوصية التنفيذية الكاملة| P6_6\n    AdminActor -->|الموافقة على التنفيذ| P6_6\n    P6_6 -->|أمر الاعتماد| P6_7\n    P6_7 -->|توليد الكوبون أو تحديث السعر| OrderStore\n    P6_7 -->|تسجيل قرار الوكيل والهاش| AuditStore", "flowchart TD\n    %% Start\n    ReqAPI[\"1. طلب الوكيل الوارد عبر API<br/>POST /api/v1/agents/{agent_name}/execute\"]\n\n    %% Process steps\n    P6_4_1[\"6.4.1 الفرز الكشفي السريع عبر التعابير النمطية<br/>Fast-Path Regex Classifier (orchestrator.py)\"]\n    P6_4_2[\"6.4.2 استعلام SQL المجمع والمتعدد (CTE)<br/>Multi-CTE Live Aggregation (analytics.py)\"]\n    P6_4_3[\"6.4.3 المحرك الحسابي الحتمي وحساب العائد<br/>Deterministic Python Engine (pricing.py / calc_roi)\"]\n    P6_4_4[\"6.4.4 بوابة الحظر وقمع الهامش الجبري<br/>Regulatory Margin Clamp (finance.py)\"]\n    P6_4_5[\"6.4.5 تجهيز البرومبت وحجب البيانات الشخصية<br/>Prompt Construction & PII Masking ([[الاسم]])\"]\n    P6_4_6[\"6.4.6 استدعاء النموذج اللغوي المتدرج<br/>Tiered LLM Execution (Cloud / Local / Rule)\"]\n    P6_4_7[\"6.4.7 تنظيف المخرجات واستعادة البيانات<br/>JSON Extraction & PII Restoration (_restore_pii)\"]\n    P6_4_8[\"6.4.8 بوابة المراجعة البشرية والاعتماد<br/>Maker-Checker Execution Gate (router.py)\"]\n    P6_4_9[\"6.4.9 تنفيذ المعاملة في قاعدة البيانات<br/>Database Persistence (coupons / orders)\"]\n    P6_4_10[\"6.4.10 توثيق القيد وبصمة الهاش الفيزيائية<br/>WORM Ledger Physical fsync (worm_ledger.py)\"]\n\n    %% Flow connections\n    ReqAPI --> P6_4_1\n    P6_4_1 -->|المسار السريع الفوري| P6_4_2\n    P6_4_2 -->|الأرقام الحية من جداول المبيعات| P6_4_3\n    P6_4_3 -->|مؤشرات الهامش والعائد الخام| P6_4_4\n    P6_4_4 -->|النسب المقيدة والمحصنة بقواعد الحزمة| P6_4_5\n    P6_4_5 -->|نص البرومبت المجهل بدون أسماء مرضى| P6_4_6\n    P6_4_6 -->|الاستجابة النصية المفسرة للقرار| P6_4_7\n    P6_4_7 -->|كائن القرار المهيكل مع الاسم المستعاد| P6_4_8\n    P6_4_8 -->|اعتماد المسؤول التنفيذي| P6_4_9\n    P6_4_9 -->|المعاملة المكتملة بنجاح| P6_4_10\n    P6_4_10 -->|صك الإنجاز وبصمة الهاش المعتمدة| EndResp[\"استجابة نهائية مؤمنة وموثقة للمستخدم\"]", "flowchart LR\n    %% Actors\n    Customer([\"العميل / المريض\"])\n    Pharmacist([\"الصيدلي السريري\"])\n    ProcManager([\"مدير المشتريات\"])\n    Accountant([\"المحاسب المالي\"])\n    SuperAdmin([\"المدير التنفيذي\"])\n    Auditor([\"مفتش الحوكمة\"])\n    AIEngine([\"محرك الذكاء الاصطناعي\"])\n    N8nEngine([\"نظام أتمتة n8n\"])\n\n    %% Use Cases Boundary\n    subgraph AICOSBoundary[\"نظام AI-COS المؤسسي\"]\n        UC1([\"UC-01: توثيق الدخول وإدارة الجلسات\"])\n        UC2([\"UC-02: رفع ومطابقة الروشتات الطبية\"])\n        UC3([\"UC-03: صرف الأدوية وتأكيد أوامر البيع\"])\n        UC4([\"UC-04: إصدار ومصادقة أوامر الشراء\"])\n        UC5([\"UC-05: استلام الشحنات وتحديث المخزون\"])\n        UC6([\"UC-06: تشغيل واستشارة الوكلاء الأذكياء\"])\n        UC7([\"UC-07: اعتماد قرارات استخبارات السوق\"])\n        UC8([\"UC-08: فحص ميزان المراجعة وقانون بنفورد\"])\n        UC9([\"UC-09: التحقق من سجل WORM التشفيري\"])\n        UC10([\"UC-10: الاستشارة الطبية عبر الشات بوت\"])\n        UC11([\"UC-11: إعادة ملء أدوية الأمراض المزمنة\"])\n        UC12([\"UC-12: توصيف وتبديل الحزم الرأسية\"])\n    end\n\n    %% Actor Connections\n    Customer --> UC1\n    Customer --> UC2\n    Customer --> UC3\n    Customer --> UC10\n\n    Pharmacist --> UC1\n    Pharmacist --> UC2\n    Pharmacist --> UC3\n    Pharmacist --> UC5\n\n    ProcManager --> UC1\n    ProcManager --> UC4\n    ProcManager --> UC5\n\n    Accountant --> UC1\n    Accountant --> UC8\n\n    SuperAdmin --> UC1\n    SuperAdmin --> UC4\n    SuperAdmin --> UC6\n    SuperAdmin --> UC7\n    SuperAdmin --> UC9\n    SuperAdmin --> UC12\n\n    Auditor --> UC8\n    Auditor --> UC9\n\n    AIEngine --> UC2\n    AIEngine --> UC6\n    AIEngine --> UC7\n    AIEngine --> UC10\n    AIEngine --> UC11\n\n    N8nEngine --> UC11\n    N8nEngine --> UC7", "flowchart TD\n    StartNode([بداية: رفع المريض صورة الروشتة]) --> HashImg[توليد بصمة SHA-256 للصورة وتخزينها]\n    HashImg --> RunOCR[تشغيل محرك الرؤية TrOCR / Florence-2]\n    RunOCR --> MatchLASA[المطابقة الدقيقة لمنع أخطاء تشابه الأسماء LASA]\n    MatchLASA --> CheckMemory[فحص ذاكرة التصحيحات السابقة OCR Memory]\n    CheckMemory --> CheckDDI{هل يوجد تعارض دوائي حرج؟<br/>DDI Severity Major/Contraindicated}\n\n    CheckDDI -- نعم --> BlockDispense[حظر الصرف الفوري وتحويل الحالة إلى NEEDS_ATTENTION]\n    BlockDispense --> AlertPharmacist[إرسال إشعار تحذيري للصيدلي لمراجعة الطبيب المعالج]\n    AlertPharmacist --> PharmacistDecision{هل يقرر الصيدلي التجاوز السريري المبرر؟}\n    PharmacistDecision -- لا --> RejectPrescription[رفض صرف الروشتة وإبلاغ المريض]\n    RejectPrescription --> EndNode([نهاية العملية])\n\n    PharmacistDecision -- نعم --> LogOverrideReason[توثيق هوية الصيدلي وسبب التجاوز كتابياً]\n    LogOverrideReason --> CheckStock\n    CheckDDI -- لا --> CheckStock{هل الأدوية متوفرة في المخزون؟}\n\n    CheckStock -- لا --> SuggestEquivalents[اقتراح البدائل الحيوية والعلاجية المكافئة المتوفرة]\n    SuggestEquivalents --> ApproveAlternatives{هل يوافق العميل/الصيدلي على البديل؟}\n    ApproveAlternatives -- لا --> HoldOrder[تعليق الطلب لحين التوريد]\n    ApproveAlternatives -- نعم --> ReplaceItem[استبدال الصنف في الوصفة]\n    ReplaceItem --> LockInventory\n\n    CheckStock -- نعم --> LockInventory[حجز المخزون بقفل تشاؤمي SELECT FOR UPDATE]\n    LockInventory --> GenerateOrder[إنشاء أمر البيع وتوليد قيد اليومية الآلي]\n    GenerateOrder --> AnchorWORM[قفل بصمة المعاملة في سجل WORM]\n    AnchorWORM --> SuccessNode([نهاية: صرف الدواء بنجاح للمريض])", "flowchart TD\n    StartProc([بداية: فحص دوري للمخزون]) --> CalcBurn[حساب معدل النضوب اليومي Burn Rate لآخر 30 يوماً]\n    CalcBurn --> CheckROP{هل الرصيد المتبقي <= نقطة إعادة الطلب ROP؟}\n\n    CheckROP -- لا --> WaitCycle[الانتظار لدورة الفحص التالية]\n    WaitCycle --> EndProc([نهاية الدورة])\n\n    CheckROP -- نعم --> CalcEOQ[حساب كمية الطلب الاقتصادي Wilson EOQ]\n    CalcEOQ --> SelectSupplier[تحديد المورد المعتمد وفق شروط الائتمان وسرعة التوريد]\n    SelectSupplier --> DraftPO[إنشاء مسودة أمر الشراء DRAFT PO]\n    DraftPO --> NotifyManager[إرسال إشعار لصاحب الصلاحية للمصادقة]\n    NotifyManager --> ManagerApproval{هل اعتمد المدير أمر الشراء؟<br/>Maker-Checker Gate}\n\n    ManagerApproval -- لا --> RejectPO[إلغاء المسودة وتوثيق سبب الرفض في سجل التدقيق]\n    RejectPO --> EndProc\n\n    ManagerApproval -- نعم --> DispatchPO[تحديث الحالة إلى APPROVED وإرسال الطلب للمورد]\n    DispatchPO --> WaitDelivery[انتظار شحن وتوريد البضاعة]\n    WaitDelivery --> InspectGoods{هل الشحنة مطابقة للفاتورة وتواريخ الصلاحية سليمة؟}\n\n    InspectGoods -- لا --> DisputePO[تسجيل إشعار خلاف جزئي وإرجاع العبوات المعيبة]\n    DisputePO --> UpdateActualStock\n    InspectGoods -- نعم --> UpdateActualStock[تأكيد الاستلام الكامل وزيادة رصيد المخزون]\n\n    UpdateActualStock --> RecalcWAC[إعادة حساب متوسط التكلفة المرجح للصنف]\n    RecalcWAC --> AutoJV[توليد قيد اليومية: من حـ/ المخزون إلى حـ/ الموردين]\n    AutoJV --> AnchorPOWORM[توثيق المعاملة ورقم الفاتورة بسجل WORM]\n    AnchorPOWORM --> EndSuccessProc([نهاية: اكتمال دورة التوريد بنجاح])", "flowchart TD\n    StartMI([بداية: تشغيل مسح استخبارات السوق]) --> FetchEDA[رصد منشورات هيئة الدواء وسحب التشغيلات EDA Circulars]\n    FetchEDA --> CheckRecall{هل يوجد منشور بسحب تشغيلة دوائية أو حظر صنف؟}\n\n    CheckRecall -- نعم --> ScanBatches[فحص أرصدة المخزون للتشغيلة المحددة]\n    ScanBatches --> BatchFound{هل توجد عبوات من هذه التشغيلة بالمخزن؟}\n    BatchFound -- نعم --> DraftQuarantine[توليد مقترح عزل مخزون فوري QUARANTINE_BATCH]\n    DraftQuarantine --> ExecutiveGate{مصادقة المدير التنفيذي<br/>Executive Approval}\n\n    ExecutiveGate -- لا --> LogRejectAction[توثيق رفض الإجراء التنفيذي]\n    ExecutiveGate -- نعم --> ExecQuarantine[عزل العبوات فورياً وتصفير رصيد البيع]\n    ExecQuarantine --> AlertPatients[إطلاق تنبيه عاجل للمرضى الذين اشتروا التشغيلة عبر n8n]\n    AlertPatients --> AnchorMIWORM[قفل بصمة القرار في سجل WORM المنيع]\n\n    CheckRecall -- لا --> CheckShortage{هل رصد محرك الذكاء الاصطناعي نقصاً حاداً في السوق لمرضى مزمنين؟}\n    CheckShortage -- نعم --> DraftEmergencyPO[توليد مقترح أمر توريد استباقي DRAFT_PURCHASE_ORDER]\n    DraftEmergencyPO --> ExecutiveGate\n    CheckShortage -- لا --> EndMINode([نهاية: استقرار حالة السوق والمخزون])\n    AnchorMIWORM --> EndMINode", "sequenceDiagram\n    autonumber\n    actor Customer as العميل / المريض\n    participant UI as واجهة الشات العائم (FloatingChatWidget)\n    participant Router as مسار الذكاء الاصطناعي (ai/router.py)\n    participant Guard as حارس الأمان (Security Guard)\n    participant RAG as محرك البحث الدلالي (RAG Service)\n    participant LLM as النموذج اللغوي المعتمد (Tiered LLM)\n    participant Audit as سجل التدقيق (Audit Trail)\n\n    Customer->>UI: إرسال استفسار دوائي / طبي\n    UI->>Router: POST /api/v1/ai/chat (Message, SessionID)\n    Router->>Guard: validate_prompt_safety(Message)\n\n    alt محاولة كسر القيود أو حقن أوامر (Prompt Injection)\n        Guard-->>Router: تم رصد هجوم أمني (Threat Detected)\n        Router->>Audit: log_security_event(SessionID, IP, ThreatLevel=HIGH)\n        Router-->>UI: رد محايد: عذراً، لا يمكن معالجة هذا الطلب لدواعي الأمان\n        UI-->>Customer: عرض رسالة التنبيه الأمني\n    else الاستفسار سليم ومصرح به\n        Guard-->>Router: الطلب آمن (Safe Request)\n        Router->>RAG: search_hybrid_knowledge(Message, k=3)\n        RAG-->>Router: الكتالوج الطبي + سياق التحذيرات الدوائية\n        Router->>Router: بناء البرومبت المحصن والمقيد بالسياق المسترجع\n        Router->>LLM: execute_tiered_llm(Prompt, Strategy=cloud_first)\n        LLM-->>Router: الصياغة الطبية التوجيهية\n        Router->>Router: إضافة تنبيه إخلاء المسؤولية القانوني الإلزامي\n        Router->>Audit: log_chat_session(SessionID, TokenUsage, Latency)\n        Router-->>UI: 200 OK (Response Text, Citations)\n        UI-->>Customer: عرض الإجابة مع خيار الاستماع الصوتي أو تصدير PDF\n    end", "sequenceDiagram\n    autonumber\n    actor InvAgent as وكيل المخزون الذكي (الصانع)\n    participant POService as وحدة المشتريات (Procurement Service)\n    participant DB as قاعدة البيانات (PostgreSQL)\n    actor Manager as مدير الصيدلية (المراجع)\n    participant Accounting as وحدة المحاسبة (AIS Service)\n    participant WORM as محرك سجل WORM (worm_ledger.py)\n    participant Disk as القرص الفيزيائي (Append-Only Log)\n\n    InvAgent->>POService: create_reorder_proposal(DrugID, EOQ_Qty)\n    POService->>DB: INSERT INTO purchase_orders (status='DRAFT')\n    DB-->>POService: PO_ID (DRAFT Created)\n    POService-->>Manager: إشعار بوجود مسودة أمر شراء تنتظر المصادقة\n\n    Manager->>POService: POST /procurement/orders/{PO_ID}/approve\n    POService->>DB: UPDATE purchase_orders SET status='APPROVED', approved_by=ManagerID\n    POService-->>Manager: 200 OK (Order Approved & Sent to Supplier)\n\n    Note over Manager, POService: وصول الشحنة من المورد وفحصها\n    Manager->>POService: POST /procurement/orders/{PO_ID}/receive (Quantities, InvoiceTotal)\n    POService->>DB: UPDATE inventory_items SET stock = stock + ReceivedQty\n    POService->>DB: UPDATE purchase_orders SET status='RECEIVED'\n\n    POService->>Accounting: record_procurement_journal_entry(PO_ID, TotalAmount)\n    Accounting->>DB: INSERT INTO journal_entries (TotalDebit, TotalCredit)\n    Accounting->>DB: INSERT INTO journal_entry_lines (Inventory: Dr, AccountsPayable: Cr)\n    Accounting-->>POService: JV_ID (Balanced Entry Recorded)\n\n    POService->>WORM: append_entry(EventID, 'PURCHASE_ORDER_RECEIVED', PayloadHash)\n    WORM->>WORM: حساب الهاش المشفر: SHA-256(Record || PrevHash)\n    WORM->>Disk: write_jsonl_line(EncryptedEntry)\n    WORM->>Disk: os.fsync() قسرية لمنع التراجع\n    Disk-->>WORM: قرص فيزيائي محدث\n    WORM-->>POService: بصمة السجل التشفيرية المعتمدة", "erDiagram\n    TENANTS ||--o{ CUSTOMERS : isolates\n    TENANTS ||--o{ ORDERS : owns\n    TENANTS ||--o{ INVENTORY_ITEMS : stocks\n    TENANTS ||--o{ PURCHASE_ORDERS : issues\n    TENANTS ||--o{ JOURNAL_ENTRIES : records\n    TENANTS ||--o{ AUDIT_LOGS : tracks\n    TENANTS ||--o{ MARKET_ACTIONS : authorizes\n    TENANTS ||--o{ SUPPLIERS : registers\n\n    CUSTOMERS ||--o{ ORDERS : places\n    CUSTOMERS ||--o{ CUSTOMER_CYCLES : monitors\n    CUSTOMERS ||--o{ PRESCRIPTIONS : uploads\n    CUSTOMERS ||--o{ USER_SESSIONS : authenticates\n\n    ORDERS ||--|{ ORDER_ITEMS : contains\n    DRUGS ||--o{ ORDER_ITEMS : ordered_in\n    DRUGS ||--o{ INVENTORY_ITEMS : stocked_in\n    DRUGS ||--o{ DRUG_INTERACTIONS : conflicts_with_a\n    DRUGS ||--o{ DRUG_INTERACTIONS : conflicts_with_b\n\n    PRESCRIPTIONS ||--o{ PRESCRIPTION_ANALYSES : processed_by\n    PRESCRIPTION_ANALYSES ||--|{ PRESCRIPTION_ITEMS : extracts\n    DRUGS ||--o{ PRESCRIPTION_ITEMS : maps_to\n    DRUGS ||--o{ OCR_CORRECTIONS : learns_from\n\n    PURCHASE_ORDERS ||--|{ PURCHASE_ORDER_ITEMS : details\n    DRUGS ||--o{ PURCHASE_ORDER_ITEMS : supplies\n    SUPPLIERS ||--o{ PURCHASE_ORDERS : fulfills\n\n    OR
