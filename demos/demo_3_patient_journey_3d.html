<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التجربة 3: رحلة المريض والمدار الدوائي — Patient Journey 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --emerald: #10b981;
      --bg: #0f172a;
      --card: rgba(30, 41, 59, 0.85);
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      padding: 30px 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; text-align: center; }

    .back-hub {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #818cf8;
      font-weight: 800;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── 3D Solar Orbit for Chronic Meds ── */
    .orbit-stage {
      position: relative;
      width: 440px;
      height: 440px;
      margin: 40px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(99, 102, 241, 0.4);
      animation: spin-orbit 25s linear infinite;
    }
    .ring-1 { width: 260px; height: 260px; }
    .ring-2 { width: 400px; height: 400px; animation-duration: 40s; animation-direction: reverse; }

    @keyframes spin-orbit { 100% { transform: rotate(360deg); } }

    .center-sun {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #4f46e5 0%, #1e1b4b 100%);
      box-shadow: 0 0 50px rgba(79, 70, 229, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      z-index: 10;
    }

    /* Orbiting Meds */
    .planet-med {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid var(--emerald);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .planet-med:hover { transform: scale(1.3); }

    /* Confetti Particle Canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    .btn-gamify {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 800;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-gamify:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="container">
    <a href="demo_labs_hub.html" class="back-hub">← العودة لمركز التجارب الرئيسي</a>

    <h1>التجربة 3: المدار الدوائي ثلاثي الأبعاد 3D</h1>
    <p style="color: #94a3b8;">محاكاة دورة الأدوية المزمنة للمريض ومكافأة الالتزام بالجرعات اليومية.</p>

    <!-- Solar Orbit -->
    <div class="orbit-stage">
      <div class="center-sun">👤</div>
      
      <div class="orbit-ring ring-1">
        <div class="planet-med" style="top: -27px; left: 102px;" title="Amlopres 5mg">💊</div>
        <div class="planet-med" style="bottom: -27px; left: 102px;" title="Concor 5mg">🩺</div>
      </div>

      <div class="orbit-ring ring-2">
        <div class="planet-med" style="top: 172px; right: -27px;" title="Glucophage 500mg">⚡</div>
        <div class="planet-med" style="top: 172px; left: -27px;" title="Lipitor 20mg">🫀</div>
      </div>
    </div>

    <!-- Gamification Button -->
    <div>
      <button class="btn-gamify" onclick="shootConfetti()">تناولت جرعتي اليومية بنجاح 🎉</button>
    </div>
  </div>

  <script>
    /* Confetti Particle Engine */
    const cCanvas = document.getElementById('confetti-canvas');
    const cCtx = cCanvas.getContext('2d');
    let cw = cCanvas.width = window.innerWidth;
    let ch = cCanvas.height = window.innerHeight;
    window.addEventListener('resize', () => { cw = cCanvas.width = window.innerWidth; ch = cCanvas.height = window.innerHeight; });

    let confettis = [];
    class Confetti {
      constructor() {
        this.x = cw / 2;
        this.y = ch / 2;
        this.vx = (Math.random() - 0.5) * 16;
        this.vy = (Math.random() - 1) * 18;
        this.size = Math.random() * 8 + 4;
        this.color = ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#06b6d4'][Math.floor(Math.random() * 5)];
        this.gravity = 0.4;
        this.alpha = 1;
      }
      draw() {
        cCtx.fillStyle = this.color;
        cCtx.globalAlpha = this.alpha;
        cCtx.fillRect(this.x, this.y, this.size, this.size);
        cCtx.globalAlpha = 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= 0.015;
      }
    }

    function shootConfetti() {
      for (let i = 0; i < 120; i++) confettis.push(new Confetti());
    }

    function animConfetti() {
      cCtx.clearRect(0, 0, cw, ch);
      confettis = confettis.filter(c => c.alpha > 0);
      for (let c of confettis) {
        c.update();
        c.draw();
      }
      requestAnimationFrame(animConfetti);
    }
    animConfetti();
  </script>
</body>
</html>
