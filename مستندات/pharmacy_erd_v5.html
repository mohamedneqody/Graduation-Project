<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  TENANT ||--o{ CUSTOMER : owns
  TENANT ||--o{ ORDER_TBL : scopes
  TENANT ||--o{ NOTIFICATION : scopes
  TENANT ||--o{ AUDIT_LOG : scopes
  TENANT ||--o{ TENANT_SETTINGS : configures
  CUSTOMER ||--o{ SESSION : opens
  SESSION ||--o{ EVENT : logs
  CUSTOMER ||--o{ ORDER_TBL : places
  ORDER_TBL ||--o{ ORDER_ITEM : contains
  DRUG ||--o{ ORDER_ITEM : includes
  DRUG ||--o{ DRUG_INTERACTION : conflicts
  DRUG ||--o{ DRUG_AFFINITY : pairs_with
  CUSTOMER ||--o{ CUSTOMER_CYCLE : has
  DRUG ||--o{ CUSTOMER_CYCLE : tracked_for
  CUSTOMER ||--o{ NOTIFICATION : receives
  CUSTOMER ||--o{ AUDIT_LOG : triggers
  CUSTOMER ||--o{ PENDING_REMINDER : flagged_for
  DRUG ||--o{ PENDING_REMINDER : target_drug
  DRUG ||--o{ INVENTORY_ITEM : stocked_as
  NOTIFICATION ||--o{ AB_TEST_RESULT : linked_to
  AB_TEST ||--o{ AB_TEST_RESULT : tracks
  TENANT {
    uuid tenant_id PK
    string name
    string subdomain
    boolean is_active
    timestamp created_at
  }
  TENANT_SETTINGS {
    uuid setting_id PK
    uuid tenant_id FK
    string key
    string value
    timestamp updated_at
  }
  CUSTOMER {
    uuid customer_id PK
    uuid auth_user_id
    uuid tenant_id FK
    string email
    string full_name
    string phone
    string preferred_channel
    string role
    timestamp created_at
  }
  SESSION {
    uuid session_id PK
    uuid tenant_id FK
    uuid customer_id FK
    string device_info
    timestamp started_at
  }
  EVENT {
    uuid event_id PK
    uuid session_id FK
    string event_type
    json payload
    timestamp timestamp
  }
  ORDER_TBL {
    uuid order_id PK
    uuid tenant_id FK
    uuid customer_id FK
    string status
    string channel
    float total_amount
    timestamp order_date
  }
  ORDER_ITEM {
    uuid order_item_id PK
    uuid order_id FK
    uuid drug_id FK
    int quantity
    float unit_price
  }
  DRUG {
    uuid drug_id PK
    string brand_name
    string generic_name
    string category
    boolean is_chronic
    int default_cycle_days
    float base_price
    string care_type
  }
  DRUG_INTERACTION {
    uuid interaction_id PK
    uuid drug_id_a FK
    uuid drug_id_b FK
    string severity
    string description
  }
  DRUG_AFFINITY {
    uuid affinity_id PK
    uuid drug_id_a FK
    uuid drug_id_b FK
    float confidence_score
  }
  CUSTOMER_CYCLE {
    uuid customer_id PK_FK
    uuid drug_id PK_FK
    float avg_cycle_days
    date last_purchase_date
    date reminder_day
  }
  NOTIFICATION {
    uuid notification_id PK
    uuid tenant_id FK
    uuid customer_id FK
    string notification_type
    string channel
    string ab_variant
    string status
    timestamp sent_at
    timestamp created_at
  }
  AUDIT_LOG {
    uuid log_id PK
    uuid tenant_id FK
    string actor_id
    string action_type
    string target_entity
    timestamp timestamp
  }
  PENDING_REMINDER {
    uuid reminder_id PK
    uuid customer_id FK
    uuid drug_id FK
    string channel
    string decision
    float cycle_confidence
    float churn_probability
    float predicted_days
    string status
    timestamp created_at
    timestamp processed_at
  }
  INVENTORY_ITEM {
    uuid inventory_id PK
    uuid drug_id FK
    int quantity_on_hand
    int reorder_level
    float cost_price
    timestamp updated_at
  }
  AB_TEST {
    uuid test_id PK
    string test_name
    string variant_a
    string variant_b
    string status
    timestamp started_at
    timestamp ended_at
  }
  AB_TEST_RESULT {
    uuid result_id PK
    uuid test_id FK
    uuid notification_id FK
    string variant
    boolean converted
    timestamp recorded_at
  }
  KNOWLEDGE_CHUNK {
    uuid chunk_id PK
    string source_type
    string content
    json embedding
    timestamp created_at
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
